name: Reusable Self-Hosted Security Gate

on:
  workflow_call:
    inputs:
      runner_labels:
        description: "JSON array of runner labels (route fork PRs to ubuntu-latest)"
        required: false
        type: string
        default: '["self-hosted","Linux","X64","dustbowl-linux"]'
      fail_on_severity:
        description: "Trivy severity levels that fail the build"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      image_ref:
        description: "Optional OCI image reference to scan with Trivy OSS"
        required: false
        type: string
        default: ""
      run_semgrep:
        description: "Run Semgrep OSS SAST scan"
        required: false
        type: boolean
        default: true
      semgrep_config:
        description: "Semgrep OSS ruleset(s) (comma/space separated local path or p/security-audit)"
        required: false
        type: string
        default: "p/security-audit"
      semgrep_blocking:
        description: "Fail the job if Semgrep finds issues"
        required: false
        type: boolean
        default: false
      semgrep_baseline_commit:
        description: "Optional git commit/ref for Semgrep --baseline-commit (or 'auto' for PR base SHA)"
        required: false
        type: string
        default: ""
      check_dockerfile:
        description: "Verify Dockerfiles enforce non-root final USER and safe instructions"
        required: false
        type: boolean
        default: true
      require_pinned_digest:
        description: "Require @sha256 image digests in Dockerfile FROM instructions"
        required: false
        type: boolean
        default: false
      check_k8s_helm:
        description: "Scan Kubernetes manifests and Helm charts for unsafe security contexts and plaintext TLS"
        required: false
        type: boolean
        default: false
      helm_chart_dir:
        description: "Optional Helm chart or Kubernetes manifest directory"
        required: false
        type: string
        default: ""
      baseline_file:
        description: "Optional JSON baseline file for infrastructure safety waivers"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  security-gate:
    name: Self-Hosted Security Gate
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout org security gate assets
        if: inputs.run_semgrep || inputs.check_dockerfile || inputs.check_k8s_helm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DustBowl-Games/.github
          path: .org-ci
          sparse-checkout: |
            .semgrep/antislop-rules.yml
            .github/scripts/audit-infra-safety.py
          persist-credentials: false

      - name: Run Gitleaks Secret Scan (OSS)
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/docker-anon"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-anon" docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" git /repo --redact=100 --gitleaks-ignore-path /repo

      - name: Run Trivy Filesystem & IaC Scan (OSS)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:de81be41be9665a7b761680cd4bb570313a923154b994c79b49b5a55f1a55e35
          FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-anon"
          trivy_args=(fs --scanners "vuln,misconfig" --severity "$FAIL_ON_SEVERITY" --ignore-unfixed --exit-code 1)
          if [ -f "$GITHUB_WORKSPACE/.trivyignore" ]; then
            trivy_args+=(--ignorefile /repo/.trivyignore)
          fi
          DOCKER_CONFIG="$RUNNER_TEMP/docker-anon" docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            "$TRIVY_IMAGE" "${trivy_args[@]}" /repo

      - name: Run Trivy Container Image Scan (OSS)
        if: inputs.image_ref != ''
        env:
          TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:de81be41be9665a7b761680cd4bb570313a923154b994c79b49b5a55f1a55e35
          FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-anon"
          docker_args=(--rm --volume /var/run/docker.sock:/var/run/docker.sock)
          trivy_args=(image --severity "$FAIL_ON_SEVERITY" --ignore-unfixed --exit-code 1)
          if [ -f "$GITHUB_WORKSPACE/.trivyignore" ]; then
            docker_args+=(--volume "$GITHUB_WORKSPACE/.trivyignore:/.trivyignore:ro")
            trivy_args+=(--ignorefile /.trivyignore)
          fi
          DOCKER_CONFIG="$RUNNER_TEMP/docker-anon" docker run "${docker_args[@]}" \
            "$TRIVY_IMAGE" "${trivy_args[@]}" "$IMAGE_REF"

      - name: Set up Python for Semgrep & Infra Safety
        if: inputs.run_semgrep || inputs.check_dockerfile || inputs.check_k8s_helm
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run Semgrep OSS SAST
        if: inputs.run_semgrep
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
          SEMGREP_BLOCKING: ${{ inputs.semgrep_blocking }}
          SEMGREP_BASELINE_COMMIT: ${{ inputs.semgrep_baseline_commit }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep

          cfg_args=()
          for token in ${SEMGREP_CONFIG//,/ }; do
            if [ -n "$token" ]; then
              cfg_args+=(--config "$token")
            fi
          done

          org_rules=".org-ci/.semgrep/antislop-rules.yml"
          caller_rules=".semgrep/antislop-rules.yml"
          if [ -f "$caller_rules" ] && [ -f "$org_rules" ]; then
            if cmp -s "$org_rules" "$caller_rules"; then
              cfg_args+=(--config "$caller_rules")
            else
              merged_org="$RUNNER_TEMP/org-antislop-nonoverlapping.yml"
              rm -f "$merged_org"
              "$RUNNER_TEMP/semgrep-venv/bin/python" -c '
              import sys, yaml
              org_path, caller_path, out_path = sys.argv[1:4]
              with open(caller_path, encoding="utf-8") as f:
                  caller_doc = yaml.safe_load(f) or {}
              with open(org_path, encoding="utf-8") as f:
                  org_doc = yaml.safe_load(f) or {}
              caller_ids = {r.get("id") for r in caller_doc.get("rules", []) if isinstance(r, dict)}
              extra = [r for r in org_doc.get("rules", []) if isinstance(r, dict) and r.get("id") not in caller_ids]
              if extra:
                  with open(out_path, "w", encoding="utf-8") as f:
                      yaml.safe_dump({"rules": extra}, f, sort_keys=False)
              ' "$org_rules" "$caller_rules" "$merged_org"
              if [ -s "$merged_org" ]; then
                cfg_args+=(--config "$merged_org")
              fi
              cfg_args+=(--config "$caller_rules")
            fi
          elif [ -f "$caller_rules" ]; then
            cfg_args+=(--config "$caller_rules")
          elif [ -f "$org_rules" ]; then
            cfg_args+=(--config "$org_rules")
          fi

          if [ "${#cfg_args[@]}" -eq 0 ]; then
            echo "::error::No Semgrep rulesets resolved."
            exit 1
          fi

          scan_args=(scan --metrics=off "${cfg_args[@]}" --exclude ".org-ci" --quiet)

          base_sha="$SEMGREP_BASELINE_COMMIT"
          if [ "$base_sha" = "auto" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
              base_sha="$PR_BASE_SHA"
            else
              base_sha=""
            fi
          fi
          if [ -n "$base_sha" ]; then
            if ! git rev-parse --verify "$base_sha" >/dev/null 2>&1; then
              if ! git fetch --no-tags --depth=1 origin "$base_sha" >/dev/null 2>&1; then
                echo "[INFO] Unable to resolve Semgrep baseline commit '$base_sha'; scanning full tree."
                base_sha=""
              fi
            fi
            if [ -n "$base_sha" ]; then
              scan_args+=(--baseline-commit "$base_sha")
            fi
          fi

          if [ "$SEMGREP_BLOCKING" = "true" ]; then
            scan_args+=(--error --severity ERROR)
          fi

          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" "${scan_args[@]}" .

      - name: Check Dockerfile & K8s/Helm Safety
        if: inputs.check_dockerfile || inputs.check_k8s_helm
        env:
          CHECK_DOCKERFILE: ${{ inputs.check_dockerfile }}
          REQUIRE_PINNED_DIGEST: ${{ inputs.require_pinned_digest }}
          CHECK_K8S_HELM: ${{ inputs.check_k8s_helm }}
          HELM_CHART_DIR: ${{ inputs.helm_chart_dir }}
          BASELINE_FILE: ${{ inputs.baseline_file }}
        run: |
          infra_args=(--repo-root "$GITHUB_WORKSPACE")
          if [ "$CHECK_DOCKERFILE" = "true" ]; then
            infra_args+=(--check-dockerfile)
          else
            infra_args+=(--no-dockerfile)
          fi
          if [ "$REQUIRE_PINNED_DIGEST" = "true" ]; then
            infra_args+=(--require-pinned-digest)
          fi
          if [ "$CHECK_K8S_HELM" = "true" ]; then
            infra_args+=(--check-k8s-helm)
          fi
          if [ -n "$HELM_CHART_DIR" ]; then
            infra_args+=(--helm-chart-dir "$HELM_CHART_DIR")
          fi
          if [ -n "$BASELINE_FILE" ]; then
            infra_args+=(--baseline "$BASELINE_FILE")
          fi
          python3 .org-ci/.github/scripts/audit-infra-safety.py "${infra_args[@]}"
