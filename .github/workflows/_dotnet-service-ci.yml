name: Reusable .NET Service CI

on:
  workflow_call:
    inputs:
      runner_labels:
        description: "JSON array of runner labels (route fork PRs to ubuntu-latest)"
        required: false
        type: string
        default: '["self-hosted","Linux","X64","dustbowl-linux"]'
      project_path:
        description: "Path to .csproj or .sln"
        required: true
        type: string
      dotnet_version:
        description: ".NET SDK version"
        required: false
        type: string
        default: "10.0.x"
      sdk_image:
        description: "Container SDK image"
        required: false
        type: string
        default: "mcr.microsoft.com/dotnet/sdk:10.0"
      helm_chart_path:
        description: "Optional Helm chart directory to lint"
        required: false
        type: string
        default: ""
      image_name:
        description: "GHCR image name (e.g. ghcr.io/dustbowl-games/my-service)"
        required: false
        type: string
        default: ""
      publish_image:
        description: "Push immutable + branch tags to GHCR"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Run dotnet test"
        required: false
        type: boolean
        default: true
      fail_on_vulnerable_nuget:
        description: "Fail build if NuGet vulnerabilities at or above nuget_audit_level are detected"
        required: false
        type: boolean
        default: true
      run_format_check:
        description: "Run dotnet format --verify-no-changes"
        required: false
        type: boolean
        default: false
      nuget_audit_level:
        description: "Minimum NuGetAudit vulnerability severity (low, moderate, high, critical)"
        required: false
        type: string
        default: "high"
      treat_warnings_as_errors:
        description: "Pass -p:TreatWarningsAsErrors=true to dotnet build"
        required: false
        type: boolean
        default: false
      warning_level:
        description: "Optional MSBuild WarningLevel property (e.g. 9999)"
        required: false
        type: string
        default: ""
      enforce_code_style:
        description: "Pass -p:EnforceCodeStyleInBuild=true to dotnet build"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    container:
      image: ${{ inputs.sdk_image }}
      options: --security-opt=no-new-privileges
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated .NET state
        run: |
          job_temp="$RUNNER_TEMP/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "$job_temp"
          {
            echo "DOTNET_JOB_TEMP=$job_temp"
            echo "DOTNET_CLI_HOME=$job_temp/dotnet-cli-home"
            echo "NUGET_PACKAGES=$job_temp/nuget-packages"
          } >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore & Build
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          NUGET_AUDIT_LEVEL: ${{ inputs.nuget_audit_level }}
          FAIL_ON_VULN: ${{ inputs.fail_on_vulnerable_nuget }}
          TREAT_WARNINGS_AS_ERRORS: ${{ inputs.treat_warnings_as_errors }}
          WARNING_LEVEL: ${{ inputs.warning_level }}
          ENFORCE_CODE_STYLE: ${{ inputs.enforce_code_style }}
        run: |
          set -euo pipefail
          audit_level="${NUGET_AUDIT_LEVEL,,}"
          case "$audit_level" in
            low) nu_codes="NU1901;NU1902;NU1903;NU1904" ;;
            moderate) nu_codes="NU1902;NU1903;NU1904" ;;
            high) nu_codes="NU1903;NU1904" ;;
            critical) nu_codes="NU1904" ;;
            *)
              echo "::error::Invalid nuget_audit_level '$NUGET_AUDIT_LEVEL' (expected low, moderate, high, or critical)."
              exit 1
              ;;
          esac

          restore_args=(-p:NuGetAudit=true -p:NuGetAuditMode=all "-p:NuGetAuditLevel=$audit_level")
          build_args=(-c Release --no-restore -p:NuGetAudit=true -p:NuGetAuditMode=all "-p:NuGetAuditLevel=$audit_level")

          if [ "$FAIL_ON_VULN" = "true" ]; then
            restore_args+=("-warnaserror:$nu_codes")
            build_args+=("-warnaserror:$nu_codes")
          fi
          if [ "$TREAT_WARNINGS_AS_ERRORS" = "true" ]; then
            build_args+=(-p:TreatWarningsAsErrors=true)
          fi
          if [ -n "$WARNING_LEVEL" ]; then
            build_args+=("-p:WarningLevel=$WARNING_LEVEL")
          fi
          if [ "$ENFORCE_CODE_STYLE" = "true" ]; then
            build_args+=(-p:EnforceCodeStyleInBuild=true)
          fi

          dotnet restore "$PROJECT_PATH" "${restore_args[@]}"
          dotnet build "$PROJECT_PATH" "${build_args[@]}"

      - name: Verify Code Formatting
        if: inputs.run_format_check
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: dotnet format "$PROJECT_PATH" --verify-no-changes --no-restore

      - name: Check Vulnerable NuGet Packages
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          FAIL_ON_VULN: ${{ inputs.fail_on_vulnerable_nuget }}
          NUGET_AUDIT_LEVEL: ${{ inputs.nuget_audit_level }}
        run: |
          set -euo pipefail
          out=$(dotnet list "$PROJECT_PATH" package --vulnerable --include-transitive)
          echo "$out"
          if [ "$FAIL_ON_VULN" = "true" ]; then
            audit_level="${NUGET_AUDIT_LEVEL,,}"
            case "$audit_level" in
              low) sev_re='\b(Low|Moderate|High|Critical)\b' ;;
              moderate) sev_re='\b(Moderate|High|Critical)\b' ;;
              high) sev_re='\b(High|Critical)\b' ;;
              critical) sev_re='\bCritical\b' ;;
              *) sev_re='\b(High|Critical)\b' ;;
            esac
            if echo "$out" | grep -qiE "$sev_re"; then
              echo "::error::NuGet vulnerabilities at or above '$audit_level' detected."
              exit 1
            fi
          fi

      - name: Test
        if: inputs.run_tests
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: dotnet test "$PROJECT_PATH" -c Release --no-build

      - name: Restore workspace ownership
        if: always()
        run: |
          [ -n "${DOTNET_JOB_TEMP:-}" ] && rm -rf -- "$DOTNET_JOB_TEMP"
          workspace_owner="$(stat -c '%u:%g' "$RUNNER_WORKSPACE")"
          chown --recursive "$workspace_owner" "$GITHUB_WORKSPACE"

  helm-lint:
    name: Helm Lint
    if: inputs.helm_chart_path != ''
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.15.0
      - env:
          HELM_CHART_PATH: ${{ inputs.helm_chart_path }}
        run: helm lint "$HELM_CHART_PATH"

  package-and-sbom:
    name: Container Build, Scan & Publish
    needs: [build-and-test]
    if: inputs.image_name != ''
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Container Image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: docker build -t "${IMAGE_NAME}:pr-check" .

      - name: Trivy Container Scan (CRITICAL/HIGH, OSS)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:de81be41be9665a7b761680cd4bb570313a923154b994c79b49b5a55f1a55e35
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-anon"
          docker_args=(--rm --volume /var/run/docker.sock:/var/run/docker.sock)
          trivy_args=(image --severity "CRITICAL,HIGH" --ignore-unfixed --exit-code 1)
          if [ -f "$GITHUB_WORKSPACE/.trivyignore" ]; then
            docker_args+=(--volume "$GITHUB_WORKSPACE/.trivyignore:/.trivyignore:ro")
            trivy_args+=(--ignorefile /.trivyignore)
          fi
          DOCKER_CONFIG="$RUNNER_TEMP/docker-anon" docker run "${docker_args[@]}" \
            "$TRIVY_IMAGE" "${trivy_args[@]}" "${IMAGE_NAME}:pr-check"

      - name: Generate CycloneDX SBOM (OSS)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:de81be41be9665a7b761680cd4bb570313a923154b994c79b49b5a55f1a55e35
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-anon"
          DOCKER_CONFIG="$RUNNER_TEMP/docker-anon" docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:/out" \
            "$TRIVY_IMAGE" image \
            --format cyclonedx \
            --output /out/sbom.cdx.json \
            "${IMAGE_NAME}:pr-check"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 7

      - name: Log in & Push to GHCR
        if: inputs.publish_image && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sha_tag="${GITHUB_REF_NAME}-${GITHUB_SHA}"
          docker tag "${IMAGE_REPO}:pr-check" "${IMAGE_REPO}:${sha_tag}"
          docker tag "${IMAGE_REPO}:pr-check" "${IMAGE_REPO}:${GITHUB_REF_NAME}"
          docker push "${IMAGE_REPO}:${sha_tag}"
          docker push "${IMAGE_REPO}:${GITHUB_REF_NAME}"
