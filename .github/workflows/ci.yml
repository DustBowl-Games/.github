name: ".github Org CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-workflows:
    name: "Test: Reusable Workflow Contracts, Gates & Self-Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install actionlint, shellcheck, and Python test deps
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"

          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin_dir" actionlint
          chmod +x "$bin_dir/actionlint"

          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$bin_dir/shellcheck"
          chmod +x "$bin_dir/shellcheck"

          echo "$bin_dir" >> "$GITHUB_PATH"

          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet pyyaml semgrep
          echo "CI_PYTHON=$RUNNER_TEMP/ci-venv/bin/python" >> "$GITHUB_ENV"
          echo "CI_SEMGREP=$RUNNER_TEMP/ci-venv/bin/semgrep" >> "$GITHUB_ENV"

      - name: Run Python unit tests
        run: |
          "$CI_PYTHON" -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Node.js unit tests
        run: node --test tests/*.test.mjs

      - name: Validate shared Semgrep antislop rules
        run: |
          "$CI_SEMGREP" scan --metrics=off --validate --config .semgrep/antislop-rules.yml

      - name: Dogfood workflow hygiene & actionlint
        run: |
          "$CI_PYTHON" .github/scripts/audit-workflows.py --repo-root "$GITHUB_WORKSPACE"

      - name: Dogfood anti-slop & cleanliness scan
        run: |
          "$CI_PYTHON" .github/scripts/audit-ai-smells.py --repo-root "$GITHUB_WORKSPACE" --all

      - name: Dogfood CI integrity, baseline ratchet & commit lint
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            node .github/scripts/audit-ci-integrity.mjs --repo-root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"
            node .github/scripts/audit-baselines.mjs --repo-root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA"
            "$CI_PYTHON" .github/scripts/verify-commit-msg.py --repo-root "$GITHUB_WORKSPACE" --range "${BASE_SHA}..${HEAD_SHA}"
          else
            node .github/scripts/audit-ci-integrity.mjs --repo-root "$GITHUB_WORKSPACE" --all
            node .github/scripts/audit-baselines.mjs --repo-root "$GITHUB_WORKSPACE"
            "$CI_PYTHON" .github/scripts/verify-commit-msg.py --repo-root "$GITHUB_WORKSPACE" --last
          fi
